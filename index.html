<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reproductor Musical · JUKEBOX</title>
  <link rel="icon" type="image/x-icon" href="img/nota-musical.png">

  <!-- Bootstrap (solo grid y utilidades puntuales) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <!-- Librería de Howler.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

</head>
<body>

  <!-- Fondo líquido -->
  <div class="aurora">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
  </div>

  <div class="app-shell container-fluid">

    <!-- Cabecera -->
    <header class="app-header d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M9 18V5l12-2v13" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="white" stroke-width="1.6"/>
            <circle cx="18" cy="16" r="3" stroke="white" stroke-width="1.6"/>
          </svg>
        </div>
        <div>
          <h1 class="app-title">Reproductor Musical</h1>
          <p class="app-subtitle">PR2 · JUKEBOX — JS nativo + Howler.js</p>
        </div>
      </div>
      <div class="header-pill d-none d-md-flex align-items-center gap-2">
        <span class="dot-live"></span>
        <span>En directo</span>
      </div>
    </header>

    <!-- Cuerpo principal -->
    <main class="row g-4 main-grid">

      <!-- Columna izquierda: lista de reproducción -->
      <section class="col-lg-7">
        <div class="glass panel playlist-panel h-100">
          <div class="panel-head d-flex align-items-center justify-content-between">
            <h2 class="panel-title">Lista de reproducción</h2>
            <span class="panel-count">11 canciones</span>
          </div>

          <ul class="track-list" id="trackList">

            

          </ul>
        </div>
      </section>

      <!-- Columna derecha: ahora suena + ecualizador -->
      <aside class="col-lg-5">
        <div class="side-stack">

          <div class="glass panel now-playing-panel">
            <span class="panel-eyebrow">Sonando ahora</span>
            <div class="now-playing-body">
              <img id="nowPlayingCover" class="now-cover" alt="Carátula de la canción">
              <div>
                <h3 id="nowTitle" class="now-title">Carefree</h3>
                <p id="nowArtist" class="now-artist">Kevin MacLeod</p>
                <span class="now-tag">Folk</span>
              </div>
            </div>
          </div>

          <div class="glass panel eq-panel">
            <div class="panel-head d-flex align-items-center justify-content-between">
              <h2 class="panel-title">Ecualizador</h2>
              <span class="panel-count">espectro en vivo</span>
            </div>

            <div class="eq-bars" id="eqBars" role="img" aria-label="Visualización del espectro de audio"></div>
          </div>

        </div>
      </aside>

    </main>
  </div>

  <!-- Barra de reproducción inferior -->
  <footer class="player-bar glass">
    <div class="player-bar-inner">

      <div class="player-track-info">
        <img id="playerCover" class="now-cover now-cover-sm" alt="Carátula de la canción">
        <div>
          <span id="songName" class="now-title-sm">Carefree</span>
          <span id="artistName" class="now-artist-sm">Kevin MacLeod</span>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="ctrl-btn" id="shuffleBtn" aria-label="Aleatorio">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6h3l9 12h6M14 6h6v6M21 6l-7 7M3 18h3l4-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="ctrl-btn" id="prevBtn" aria-label="Anterior">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-10-6z"/></svg>
          </button>
          <button class="ctrl-btn ctrl-btn-main" id="playBtn" aria-label="Reproducir / Pausa">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          </button>
          <button class="ctrl-btn" id="nextBtn" aria-label="Siguiente">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l10-6z"/></svg>
          </button>
          <button class="ctrl-btn" id="repeatBtn" aria-label="Repetir">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M3 12v-2a4 4 0 014-4h14M7 22l-4-4 4-4M21 12v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="progress-row">
          <span class="time-label" id="timeCurrent">0:22</span>
          <input type="range" class="progress-range" id="progressRange" min="0" max="100" value="12">
          <span class="time-label" id="timeTotal">3:25</span>
        </div>
      </div>

      <div class="player-volume">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
        <input type="range" class="volume-range" id="volumeRange" min="0" max="100" value="80">
        <span class="volume-value" id="volumeValue">80%</span>
      </div>

    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
